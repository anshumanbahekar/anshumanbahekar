name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # ---- Base content (on by default: header, activity, community, repositories, metadata) ----
          base: header, activity, community, repositories, metadata

    

          plugin_lines: yes


          plugin_stars: yes
          plugin_stars_limit: 4


          plugin_repositories: yes

          plugin_notable: yes



          plugin_licenses: yes

          plugin_code: yes


          # ---- Needs the new token's `repo` scope ----
          plugin_traffic: yes

