name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # ---- Base content (on by default: header, activity, community, repositories, metadata) ----
          base: header, activity, community, repositories, metadata

          # ---- Core GitHub plugins (all need only your token, no external accounts) ----
          plugin_calendar: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          plugin_lines: yes

          plugin_stargazers: yes
          plugin_stargazers_charts: yes

          plugin_stars: yes
          plugin_stars_limit: 4

          plugin_starlists: yes

          plugin_repositories: yes

          plugin_notable: yes

          plugin_contributors: yes

          plugin_people: yes

          plugin_followup: yes


          plugin_licenses: yes

          plugin_code: yes


          # ---- Needs the new token's `repo` scope ----
          plugin_traffic: yes

